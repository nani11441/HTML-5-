                <td>Coffee</td>

            </tr>
            <tr>
                <td>Tea</td>

            </tr>
            <tr>
                <td>Boost</td>
                <td>25₨</td>
            </tr>
            <tr>
                <td>Milk</td>

            </tr>
            <tr>
                <td>Lemon</td>

            </tr>
        </tbody>
    </table>

</body>

</html>
