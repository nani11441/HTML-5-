<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic And Non semantic</title>
    <style>
        body {
            background-color: darkgray;
            padding: 10px;
        }
        
        header {
            background-color: orange;
            text-align: center;
            border-radius: 30px;
            margin: 0;
        }
        
        a {
            padding: 30px;
            margin: o;
        }
        
        nav {
            text-align: center;
            background-color: burlywood;
            border-radius: 30px;
            padding: 30px;
        }
        
        main {
            text-align: center;
        }
        
        footer {
            text-align: center;
            background-color: rgb(63, 140, 140);
            padding: 30px;
        }
    </style>
</head>

<body>
    <!-- Semantic Tags -->
    <div>
        <h1>Swiggy</h1>
    </div>
    <div>
        <a href="">Home</a>
        <a href="">Products</a>
        <a href="">Login</a>
    </div>
    <div>
        <h2>Bryani</h2>
        <p>Fresh Biryanis available here</p>
    </div>
    <div>
        &copy;All right reserved.Swiggy
    </div>


    <!-- Non Semantic Tags -->

    <header>
        <h1>Zepto</h1>
    </header>
    <nav>
        <a href="">Home</a>
        <a href="">Products</a>
        <a href="">Login</a>
    </nav>
    <main>
        <h2>Vegitables</h2>
        <p>Fresh vagitables available here</p>
    </main>
    <footer>
        &copy;All right reserved.Swiggy
    </footer>





</body>

</html>
