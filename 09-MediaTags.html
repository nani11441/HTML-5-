<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media tags 📷</title>
</head>

<body>
    <!-- image tag (Absolute) -->
    <!--
 01--The <img> tag is used to display images in a web page.

It is an empty tag and does not have a closing tag.

 02--The src attribute specifies the image file path.

 03--The alt attribute shows alternate text if the image fails to load.

 04--The width attribute sets the image width.

 05--The height attribute sets the image height.

 06--The image can be loaded from a local folder or URL.

 07--The title attribute shows tooltip text on hover.

 08--Images improve the visual appearance of web pages.

The <img> tag is supported in HTML5.

Example:

<img src="photo.jpg" alt="Student Photo" width="200" height="150"> --->

    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTd5EwKmo8lQS0YtEgMVN0z4PDrX-PlRqG1srTJBReKVqkoGfB3iW5RmqI&s" alt="Chatrapathi Shivaji" title="Chatrapathi Shivaji Maharaj" height="300" width="270">
    <!-- iamge tag (Relative)-->
    <img src="./My Images/Hanuman.jpg" alt="Hanuman" title="Jai Sree Ram" height="500" width="300">
    <!-- Audio Tags -->

    <audio src="./My Images/AvaraAudio.mp3" controls autoplay muted loop></audio>
    <!-- Video Tags -->

    <video src="./My Images/AvaraVideo.mp4" controls autoplay muted loop poster="./My Images/Hanuman.jpg" height="500" width="400"></video>

</body>

</html>
