    <!--paragraph ,HTML Paragraph
HTML paragraphs are tags that are necessary for the organization and presentation of the text on a webpage and are defined with the <p> tag.
 They enable developers to break content into senseful readable blocks that enhance clarity and arrangement.
 As block-level elements, paragraphs already automatically begin on a new line and, by default, add space above and below.

Syntax

<p>This is a paragraph.</p>

The content between the tags, which is supposed to be a paragraph, is enclosed in the <p> element.
 It is a paired tag, which implies that it has opening <p> and closing </p> tags.

Note: If we are using various <p> tags in one HTML file,
then the browser automatically adds a single blank line between the two paragraphs.-->

    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Aliquid excepturi impedit laboriosam natus numquam placeat quia quidem repellat vel. Accusantium aliquid consequatur delectus facilis fugiat laboriosam molestias nobis quam quidem.</p>
