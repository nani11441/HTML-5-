<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> My Login Form</title>
</head>

<body>
    <form>
        <fieldset>
            <legend><b><i>Login Form📝</i></b></legend><br><br>
            <label for="name"><b>Name:</b></label>
            <input type="text" id="name" placeholder="Enter Name" name="name"><br><br>
            <label for="email"><b>Email:</b></label>
            <input type="email" id="email" placeholder="Enter Email" name="email">
            <br><br>
            <label for="password"><b>Password:</b></label>
            <input type="password" placeholder="Enter password" name="password">
            <br><br>
            <label><b>Gender:</b></label><br><br>

            <input type="radio" name="gender" value="Male">Male <br><br>
            <input type="radio" name="gender" value="Female">Female <br><br>
            <input type="radio" name="gender" value="Others">Others
            <br><br>
            <lable><b>Technologys:</b></lable><br><br>
            <input type="checkbox" value="Html">HTML <br><br>
            <input type="checkbox" value="CSS">CSS <br><br>
            <input type="checkbox" value="JavaScript">JavaScript <br><br>
            <input type="checkbox" value="PHP">PHP
            <br><br>

            <label for="palces"><b> Select City:</b></label><br><br>
            <select name="city" id="places">
                <option value="hidden">--Choose The city--</option>
                <option value="Hyderabad">Hyderabad</option>
                <option value="Chennai"> Chennai</option>
                <option value="Bengalor">Bengalor</option>
                <option value="Mumbai">Mumbai</option>
            </select><br><br> 0️⃣<input type="range" minlength="0" maxlength="100">💯 <br><br>

            <input type="submit" value="  Register🖋️">


        </fieldset>
    </form>

</body>

</html>
