      HTML Heading

* The HTML heading or the <h> tag marks the main or subtitle of each webpage part.
* It shows the structure of the content to users and to search engines by highlighting what is main and subordinate on the page.

* When text is put inside heading tags such as <h1>...</h1>, it is shown in bold by browsers,
* and its font size is set according to the level of the heading.
* There is less text size in each heading, beginning with <h1> and decreasing through h2, h3, h4, h5, and h6.
*  HTML headings assist search engines in finding out how a page is organized and stored.

Note: The h1 heading tag should display the main keyword of the whole content of a webpage.
Six Levels of HTML Headings
HTML supports six levels of headings:

Example
<h1>Heading no. 1</h1>
<h2>Heading no. 2</h2>
<h3>Heading no. 3</h3>
<h4>Heading no. 4</h4>
<h5>Heading no. 5</h5>
<h6>Heading no. 6</h6> ---->
